name: Deploy to production VPS

# ── Deploy-frequentie (BEWUST NIET bij elke commit) ──────────────────────────
# Op productie herstart een deploy de live PM2-processen terwijl er echte
# klanten op de stores kunnen zitten. De auto-push git-hook commit bij ELKE
# edit (`auto: <timestamp>`) naar main — daarom deployt deze workflow NIET op
# push-naar-main. Deploys zijn opzettelijk:
#   - handmatig via de Actions "Run workflow"-knop (workflow_dispatch), of
#   - door een release-tag te pushen: `git tag deploy-YYYYMMDD && git push --tags`
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'deploy-*'
      - 'v*'

# Nooit twee deploys tegelijk (voorkomt half-herstarte processen)
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  APP_DIR: /opt/dropships/app

jobs:
  deploy:
    # Nieuwe VPS-runner draagt dit label (zie scripts/provision-vps.sh)
    runs-on: [self-hosted, dropships-vps]

    steps:
      # De runner hoort als 'dropships' te draaien (svc.sh install dropships),
      # NIET als root: pm2 is per-user, dus een root-runner zou een tweede,
      # lege pm2-daemon aansturen en de echte processen nooit herstarten.
      - name: Verify runner user + tooling
        run: |
          echo "user: $(whoami)  |  cwd: $(pwd)"
          if [ "$(id -u)" = "0" ]; then
            echo "::error::Runner draait als root. Herinstalleer met: sudo ./svc.sh install dropships"
            exit 1
          fi
          command -v node >/dev/null || { echo "::error::node ontbreekt in PATH van de runner"; exit 1; }
          command -v pm2  >/dev/null || { echo "::error::pm2 ontbreekt in PATH van de runner"; exit 1; }
          echo "node $(node -v) | npm $(npm -v) | pm2 $(pm2 -v)"
          echo "pm2-processen vóór deploy:"; pm2 list || true

      - name: Pull latest code
        run: |
          cd "$APP_DIR"
          git fetch origin
          # Deploy exact de commit/tag die deze run triggerde
          git reset --hard "$GITHUB_SHA"
          git log -1 --oneline

      # GEEN env-restore meer. Op de VPS is UIcontrol/.env de ENIGE bron van
      # waarheid: gitignored + untracked, dus `git reset --hard` raakt het niet.
      # Het losse backup/restore-bestand (bron van de stale-IP bug) is geëlimineerd.
      - name: Verify single-source .env exists
        run: |
          if [ ! -f "$APP_DIR/UIcontrol/.env" ]; then
            echo "::error::UIcontrol/.env ontbreekt op de VPS. Dit is de enige env-bron; maak hem eenmalig aan (zie scripts/provision-vps.sh)."
            exit 1
          fi
          echo ".env aanwezig ($(grep -c '=' "$APP_DIR/UIcontrol/.env") variabelen) — niet overschreven"

      - name: Install dependencies
        run: |
          cd "$APP_DIR/UIcontrol"
          npm ci || npm install

      - name: Build frontend
        run: |
          cd "$APP_DIR/UIcontrol"
          npm run build

      - name: Restart backend (uicontrol + store-platform)
        run: |
          cd "$APP_DIR/UIcontrol"
          pm2 restart uicontrol --update-env || pm2 start npm --name uicontrol -- run server
          pm2 restart store-platform --update-env || pm2 start npm --name store-platform -- run store-platform
          pm2 save
          # `pm2 restart` geeft 0 zodra het proces GESTART is, ook als het daarna
          # meteen crasht. Zonder deze controle lijkt de deploy geslaagd en faalt
          # pas de health check, zonder te vertellen waarom.
          sleep 3
          status=$(pm2 jlist | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const p=JSON.parse(d).find(x=>x.name==='uicontrol');
              console.log(p ? p.pm2_env.status : 'ONTBREEKT');
            })")
          echo "uicontrol status: $status"
          if [ "$status" != "online" ]; then
            echo "::error::uicontrol is niet online (status: $status)"
            pm2 logs uicontrol --lines 60 --nostream || true
            exit 1
          fi

      # Exact de commando's uit de smalle sudoers-regel (/etc/sudoers.d/dropships-nginx):
      #   dropships ALL=(root) NOPASSWD: /usr/sbin/nginx -t, /usr/bin/systemctl reload nginx
      # Volledige paden zodat sudo gegarandeerd matcht. Een code-deploy wijzigt
      # géén nginx-config (dat doet deploy-local.ts bij een store-deploy), dus
      # dit is niet-fataal: de app-herstart hierboven is het kritieke deel.
      - name: Reload nginx (optioneel, smalle sudoers)
        continue-on-error: true
        run: |
          if sudo -n /usr/sbin/nginx -t 2>&1; then
            sudo -n /usr/bin/systemctl reload nginx && echo "nginx herladen"
          else
            echo "::warning::nginx -t niet uitgevoerd (sudoers-regel ontbreekt of config ongeldig) — app draait wel"
          fi

      - name: Health check (API + UI)
        run: |
          # De server draait onder tsx en compileert bij het opstarten de hele
          # server-boom; dat kost tientallen seconden op een koude modulecache.
          # Eén `sleep 6` was daarvoor te kort — vandaar een wachtlus in plaats
          # van een vaste pauze.
          echo "— API (wachten tot :3001 luistert, max 120s):"
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3001/api/health >/dev/null 2>&1; then
              echo "  /api/health OK na ~$((i*3))s"
              break
            fi
            if [ "$i" = "40" ]; then
              echo "::error::/api/health reageerde niet binnen 120s"
              echo "── pm2 list ──";               pm2 list || true
              echo "── laatste 80 logregels ──";   pm2 logs uicontrol --lines 80 --nostream || true
              echo "── luisterende poorten ──";    (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | head -20 || true
              exit 1
            fi
            sleep 3
          done

          # Bewijst dat de Vite-build ook echt geserveerd wordt (was 'Cannot GET /').
          # Niet-ingelogd geeft de gate een 302 naar /login — dat is een gezond
          # antwoord en telt dus als geslaagd; alleen een 5xx of een ontbrekende
          # bundel is fout.
          echo "— UI:"
          code=$(curl -s -o /tmp/ui-root.html -w '%{http_code}' http://localhost:3001/)
          case "$code" in
            302)
              loc=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:3001/)
              echo "  / → 302 naar $loc (auth-gate actief) OK"
              login=$(curl -s -o /tmp/ui-login.html -w '%{http_code}' http://localhost:3001/login)
              if [ "$login" != "200" ]; then
                echo "::error::/login gaf HTTP $login"; head -c 200 /tmp/ui-login.html; exit 1
              fi
              echo "  /login serveert de inlogpagina OK"
              ;;
            200)
              if ! grep -qi '<div id="root"' /tmp/ui-root.html; then
                echo "::error::UI-root gaf 200 zonder React-mountpoint — is 'npm run build' gelukt en staat UIcontrol/dist er?"
                head -c 200 /tmp/ui-root.html; exit 1
              fi
              echo "  / serveert de UI-build OK (HTTP 200)"
              ;;
            *)
              echo "::error::UI-root gaf onverwachte HTTP $code"
              head -c 200 /tmp/ui-root.html; exit 1
              ;;
          esac

          # De publieke etalage hoort zonder login te werken
          echo "— Kopers-dashboard:"
          m=$(curl -s -o /tmp/market.html -w '%{http_code}' http://localhost:3001/market)
          if [ "$m" = "200" ]; then echo "  /market OK (HTTP 200)"; else echo "::warning::/market gaf HTTP $m"; fi

      # De Cloudflare NAMED tunnel draait als losse, altijd-aan systemd-service
      # (cloudflared.service) met een STABIELE URL — niet per deploy opnieuw
      # opgezet. We verifiëren alleen dat de publieke webhook-URL geldig is.
      - name: Verify public webhook URL (named tunnel)
        run: |
          echo "— publieke URL status:"
          curl -fsS http://localhost:3001/api/admin/public-url || echo "  (endpoint nog niet up)"
          echo ""
